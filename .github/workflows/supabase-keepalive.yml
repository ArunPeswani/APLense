name: Supabase Keep-Alive Heartbeat

on:
  schedule:
    # Runs every 3 days at midnight UTC to prevent the 7-day inactivity pause
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Allows you to manually trigger it from GitHub anytime

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Send Request to Supabase API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          
          echo "Supabase responded with HTTP status: $response"
          if [ "$response" -eq 200 ] || [ "$response" -eq 401 ]; then
            echo "Heartbeat successful! Project is active."
          else
            echo "Warning: Received unexpected status code $response"
            exit 1
          fi
